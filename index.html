<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CardCraft | Ultimate Anime Card Creator</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Orbitron:wght@500&family=Cinzel:wght@600&display=swap"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Orbitron:wght@500;700&family=Cinzel:wght@600&family=Cinzel+Decorative:wght@700&family=Inter:wght@400;700&family=Share+Tech+Mono&family=Rajdhani:wght@600&family=Playfair+Display:ital,wght@0,600;1,600&family=Bangers&family=Permanent+Marker&family=Anton&family=Press+Start+2P&display=swap"
        rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

    <div class="layout">

        <!-- LEFT PANEL -->
        <div class="panel left-panel">

            <h2>Card Editor</h2>

            <div class="profileFormGroup">
                <div class="formField">
                    <label class="formLabel" for="name">Name</label>
                    <input type="text" id="name" autocomplete="off" placeholder="Enter name to expand..."
                        onfocus="expandForm()" oninput="expandForm()">
                </div>

                <div class="conditionalFields" id="extraFields">
                    <div class="formField">
                        <label class="formLabel" for="series">Series</label>
                        <input type="text" id="series">
                    </div>

                    <div class="formField">
                        <label class="formLabel" for="role">Role</label>
                        <input type="text" id="role">
                    </div>

                    <div class="formField">
                        <label class="formLabel" for="desc">Description</label>
                        <textarea id="desc" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <div class="profileFormGroup" style="margin-top: 1rem;">
                <div class="group">
                    <label>Species</label>
                    <input type="text" id="species">
                </div>

                <div class="group">
                    <label>Gender</label>
                    <input type="text" id="gender">
                </div>
            </div>

            <div class="profileFormGroup" style="margin-top: 1rem;">
                <div class="group">
                    <label>Abilities</label>
                    <textarea id="abilities"></textarea>
                </div>

                <div class="group">
                    <label>Rarity</label>
                    <select id="rarity">
                        <option>Common</option>
                        <option>Rare</option>
                        <option>Epic</option>
                        <option>Legendary</option>
                    </select>
                </div>
            </div>



        </div>

        <!-- CENTER CARD -->
        <div class="card-section">

            <div class="card-container" id="cardContainer">

                <div class="card-inner" id="cardInner">

                    <!-- FRONT -->
                    <div class="anime-card front template1" id="card">

                        <div class="shine"></div>

                        <div class="rarity" id="cardRarity">Legendary</div>

                        <div class="card-header">

                            <div>
                                <h1 id="cardName">Character Name</h1>
                                <p id="cardSeries">Series Name</p>
                            </div>

                        </div>

                        <div class="image-area" id="dropArea">

                            <img id="cardImage" src="./assests/profilePlaceholder.jpg" alt="Upload a Image">

                            <div class="drop-text">
                                Drag & Drop / Upload / Paste Image URL
                            </div>

                        </div>

                        <div class="content">

                            <h3 id="cardRole">Main Character</h3>

                            <p id="cardDesc">Character description...</p>

                        </div>

                    </div>

                    <!-- BACK -->
                    <div class="anime-card back template1" id="cardBack">

                        <h1 id="backName">Character Name</h1>

                        <div class="back-info">

                            <p id="cardSpecies">Species</p>
                            <p id="cardGender">Gender</p>

                        </div>

                        <div class="abilities-box">

                            <h2>Abilities</h2>
                            <p id="cardAbilities">Character abilities...</p>

                        </div>



                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="panel right-panel">

            <h2>Customization</h2>

            <div class="groupBoxImg">
                <div class="slide active" id="slide-0">
                    <label class="group-title">Upload Image</label>
                    <input type="file" id="upload" accept="image/*" style="display: none;">
                    <label for="upload" class="minimal-upload-box">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                        </svg>
                        <span>Choose a file...</span>
                    </label>
                </div>

                <div class="slide" id="slide-1">
                    <label class="group-title" for="imageUrl">Image URL</label>
                    <input type="text" id="imageUrl" placeholder="https://example.com/image.jpg">
                </div>

                <div class="page-controls">
                    <span class="dot active" onclick="switchSlide(0)"></span>
                    <span class="dot" onclick="switchSlide(1)"></span>
                </div>
            </div>

            <div class="colorBoxGroup" id="backgroundDropZone">
                <div class="colorRow">
                    <label class="colorLabel" for="color1">Gradient 1</label>
                    <input type="color" id="color1" value="#DC143C">
                </div>

                <div class="colorRow">
                    <label class="colorLabel" for="color2">Gradient 2</label>
                    <input type="color" id="color2" value="#8B0000">
                </div>

                <div class="colorDesc">
                    <p>Drop a Picture...</p>
                    <span>+</span>
                </div>
            </div>

            <div class="colorBoxGroup">
                <div class="colorRow">
                    <label class="colorLabel" for="textColor">Text Color</label>
                    <input type="color" id="textColor" value="#ffffff">
                </div>

                <div class="colorRow">
                    <label class="colorLabel" for="borderColor">Border Color</label>
                    <input type="color" id="borderColor" value="#ffffff">
                </div>
            </div>

            <div class="group">
                <label>Font</label>
                <select id="fontSelect">
                    <!-- Modern & Premium -->
                    <optgroup label="Modern & Premium">
                        <option value="Poppins">Poppins (Clean)</option>
                        <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">SF Pro /
                            System (iOS Default)</option>
                        <option value="'Inter', sans-serif">Inter (Sleek)</option>
                    </optgroup>

                    <!-- Gaming & Sci-Fi / Cyber -->
                    <optgroup label="Sci-Fi & Cyberpunk">
                        <option value="Orbitron">Orbitron (Futuristic)</option>
                        <option value="'Share Tech Mono', monospace">Share Tech Mono (Hacker)</option>
                        <option value="'Rajdhani', sans-serif">Rajdhani (Mecha)</option>
                    </optgroup>

                    <!-- Traditional & Fantasy -->
                    <optgroup label="Fantasy & RPG">
                        <option value="Cinzel">Cinzel (Royal)</option>
                        <option value="'Cinzel Decorative', serif">Cinzel Decorative (Magic)</option>
                        <option value="'Playfair Display', serif">Playfair Display (Elegant)</option>
                    </optgroup>

                    <!-- Shonen & Action -->
                    <optgroup label="Action & Manga">
                        <option value="'Bangers', sans-serif">Bangers (Comic/Manga)</option>
                        <option value="'Permanent Marker', cursive">Permanent Marker (Street/Fighter)</option>
                        <option value="'Anton', sans-serif">Anton (Impact Heavy)</option>
                    </optgroup>

                    <!-- Retro & Tech -->
                    <optgroup label="Retro & Tech">
                        <option value="Monospace">System Monospace</option>
                        <option value="'Press Start 2P', cursive">Press Start 2P (8-Bit)</option>
                    </optgroup>
                </select>
            </div>

            <div class="group">
                <label>Card Template</label>
                <select id="templateSelect">
                </select>
            </div>

            <div class="buttons">
                <div class="menu-container-relative">
                    <div class="floating-menu-left" id="floatingMenu">

                        <div class="menu-options">
                            <button id="savePDF" class="menu-item" data-label="Export PDF">PDF</button>
                            <button id="saveImage" class="menu-item" data-label="Export PNG">PNG</button>
                            <button id="flipCard" class="menu-item" data-label="Flip Card">Flip</button>
                            <button id="saveLocal" class="menu-item" data-label="Save Card">Save</button>
                        </div>

                        <button class="master-btn" id="masterBtn">
                            <span class="icon">+</span>
                            <span class="btn-text">Actions</span>
                        </button>
                    </div>
                </div>

                <button id="loadCards">Gallery</button>

            </div>

        </div>

    </div>

    <script src="./assests/Notification/notification.js"></script>
    <script src="./script.js"></script>

</body>

</html>
