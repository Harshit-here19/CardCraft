<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CardCraft | Ultimate Anime Card Creator</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Orbitron:wght@500&family=Cinzel:wght@600&display=swap"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Orbitron:wght@500;700&family=Cinzel:wght@600&family=Cinzel+Decorative:wght@700&family=Inter:wght@400;700&family=Share+Tech+Mono&family=Rajdhani:wght@600&family=Playfair+Display:ital,wght@0,600;1,600&family=Bangers&family=Permanent+Marker&family=Anton&family=Press+Start+2P&display=swap"
        rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js.optimized/dist/gif.js"></script>
</head>

<body>

    <div class="layout">

        <!-- LEFT PANEL -->
        <div class="panel left-panel">

            <h2>Card Editor</h2>

            <div class="group">
                <label>Name</label>
                <input type="text" id="name">
            </div>

            <div class="group">
                <label>Series</label>
                <input type="text" id="series">
            </div>

            <div class="group">
                <label>Role</label>
                <input type="text" id="role">
            </div>

            <div class="group">
                <label>Description</label>
                <textarea id="desc"></textarea>
            </div>

            <div class="group">
                <label>Species</label>
                <input type="text" id="species">
            </div>

            <div class="group">
                <label>Gender</label>
                <input type="text" id="gender">
            </div>

            <div class="group">
                <label>Abilities</label>
                <textarea id="abilities"></textarea>
            </div>

            <div class="group">
                <label>Rarity</label>
                <select id="rarity">
                    <option>Common</option>
                    <option>Rare</option>
                    <option>Epic</option>
                    <option>Legendary</option>
                </select>
            </div>

        </div>

        <!-- CENTER CARD -->
        <div class="card-section">

            <div class="card-container" id="cardContainer">

                <div class="card-inner" id="cardInner">

                    <!-- FRONT -->
                    <div class="anime-card front template1" id="card">

                        <div class="shine"></div>

                        <div class="rarity" id="cardRarity">Legendary</div>

                        <div class="card-header">

                            <div>
                                <h1 id="cardName">Character Name</h1>
                                <p id="cardSeries">Series Name</p>
                            </div>

                        </div>

                        <div class="image-area" id="dropArea">

                            <img id="cardImage" src="https://via.placeholder.com/400x300">

                            <!-- <div class="drop-text">
                            Drag & Drop / Upload / Paste Image URL
                        </div> -->

                        </div>

                        <div class="content">

                            <h3 id="cardRole">Main Character</h3>

                            <p id="cardDesc">Character description...</p>

                        </div>

                    </div>

                    <!-- BACK -->
                    <div class="anime-card back template1" id="cardBack">

                        <h1 id="backName">Character Name</h1>

                        <div class="back-info">

                            <p id="cardSpecies">Species</p>
                            <p id="cardGender">Gender</p>

                        </div>

                        <div class="abilities-box">

                            <h2>Abilities</h2>
                            <p id="cardAbilities">Character abilities...</p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="panel right-panel">

            <h2>Customization</h2>

            <div class="group">
                <label>Upload Image</label>
                <input type="file" id="upload">
            </div>

            <div class="group">
                <label>Image URL</label>
                <input type="text" id="imageUrl">
            </div>

            <div class="group">
                <label>Gradient 1</label>
                <input type="color" id="color1" value="#ff512f">
            </div>

            <div class="group">
                <label>Gradient 2</label>
                <input type="color" id="color2" value="#dd2476">
            </div>

            <div class="group">
                <label>Text Color</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>

            <div class="group">
                <label>Border Color</label>
                <input type="color" id="borderColor" value="#ffd700">
            </div>

            <div class="group">
                <label>Font</label>
                <select id="fontSelect">
                    <!-- Modern & Premium -->
                    <optgroup label="Modern & Premium">
                        <option value="Poppins">Poppins (Clean)</option>
                        <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">SF Pro /
                            System (iOS Default)</option>
                        <option value="'Inter', sans-serif">Inter (Sleek)</option>
                    </optgroup>

                    <!-- Gaming & Sci-Fi / Cyber -->
                    <optgroup label="Sci-Fi & Cyberpunk">
                        <option value="Orbitron">Orbitron (Futuristic)</option>
                        <option value="'Share Tech Mono', monospace">Share Tech Mono (Hacker)</option>
                        <option value="'Rajdhani', sans-serif">Rajdhani (Mecha)</option>
                    </optgroup>

                    <!-- Traditional & Fantasy -->
                    <optgroup label="Fantasy & RPG">
                        <option value="Cinzel">Cinzel (Royal)</option>
                        <option value="'Cinzel Decorative', serif">Cinzel Decorative (Magic)</option>
                        <option value="'Playfair Display', serif">Playfair Display (Elegant)</option>
                    </optgroup>

                    <!-- Shonen & Action -->
                    <optgroup label="Action & Manga">
                        <option value="'Bangers', sans-serif">Bangers (Comic/Manga)</option>
                        <option value="'Permanent Marker', cursive">Permanent Marker (Street/Fighter)</option>
                        <option value="'Anton', sans-serif">Anton (Impact Heavy)</option>
                    </optgroup>

                    <!-- Retro & Tech -->
                    <optgroup label="Retro & Tech">
                        <option value="Monospace">System Monospace</option>
                        <option value="'Press Start 2P', cursive">Press Start 2P (8-Bit)</option>
                    </optgroup>
                </select>
            </div>

            <div class="group">
                <label>Card Template</label>
                <select id="templateSelect">
                </select>
            </div>

            <div class="buttons">

                <button id="flipCard">Flip Card</button>

                <button id="saveLocal">Save Card</button>
                <button id="loadCards">Gallery</button>

                <button id="saveImage">Export PNG</button>
                <button id="savePDF">Export PDF</button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
